name: LinkedIn Content as Code — Publish Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'posts/queue/**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to LinkedIn
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Unit Tests
        run: npm test

      - name: Publish Pending Posts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202608' }}
        run: node scripts/publisher.js
