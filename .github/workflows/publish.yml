name: LinkedIn Content as Code — Publish Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'posts/queue/**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to LinkedIn
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Unit Tests
        run: npm test

      - name: Publish Pending Posts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202608' }}
        run: node scripts/publisher.js

      - name: Commit and Push Lifecycle Changes
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): archive published posts and update history [skip ci]"
            git push origin main
          else
            echo "Nenhuma alteração pendente para arquivamento."
          fi
